<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucien's Lore | Enlightened Radio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #aaaaaa;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .page {
      width: min(760px, 100%);
      background: radial-gradient(circle at top left, #1a1a1a, #0a0a0a);
      border: 2px solid #222222;
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 0 35px rgba(123, 44, 191, 0.5), inset 0 0 20px rgba(123, 44, 191, 0.15);
    }
    h1 {
      margin-top: 0;
      color: #e0e0e0;
      text-shadow: 0 0 10px #7b2cbf, 0 0 20px #7b2cbf;
      letter-spacing: 2px;
    }
    .intro-header {
      margin-bottom: 1.25rem;
      padding: 0.9rem 1rem;
      border-left: 3px solid #9d4edd;
      background: rgba(123, 44, 191, 0.08);
      border-radius: 8px;
      color: #e0aaff;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .entry {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(123, 44, 191, 0.25);
    }
    .entry:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .entry-date {
      display: inline-block;
      color: #cfcfcf;
      font-size: 1rem;
      letter-spacing: normal;
      text-transform: none;
      margin-bottom: 0.35rem;
      text-decoration: underline;
      text-decoration-color: #9d4edd;
      text-underline-offset: 0.2em;
    }

    .entry-date:hover {
      color: #e0aaff;
      text-decoration-color: #e0aaff;
    }
    p { line-height: 1.7; color: #cfcfcf; }
    a { color: #c77dff; text-decoration: none; }
    .back-link { display: inline-block; margin-top: 1rem; color: #9d4edd; border-bottom: 1px dotted #9d4edd; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Lucien's Lore</h1>
    <div class="intro-header">Wanna know more about the radio host? Read more below!</div>

    <div class="entry">
      <a class="entry-date" href="entry-1/">Entry 01 · Reclamation</a>
    </div>

    <div class="entry">
      <a class="entry-date" href="entry-2/">Entry 02 · {Placeholder}</a>
    </div>

    <div class="entry">
      <a class="entry-date" href="entry-3/">Entry 03 · {Placeholder}</a>
    </div>

    <a class="back-link" href="../">← Back to Learn More</a>
  </div>
</body>
</html>
